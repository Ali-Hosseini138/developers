name: netstore
services:
  app:
    image: netstore-panel:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
    environment:
      DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
      PUBLIC_CATALOG_FILE: ${PUBLIC_CATALOG_FILE:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
  proxy:
    image: nginx:stable-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
      NGINX_ENVSUBST_FILTER: ^DEVELOPER_API_BASE_URL$$
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - 127.0.0.1:8080:80
    restart: unless-stopped
