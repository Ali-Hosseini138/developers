name: netstore
services:
  app:
    image: netstore-panel:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?required}
        DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      DEVELOPER_SESSION_SIGNING_SECRET: ${DEVELOPER_SESSION_SIGNING_SECRET:-}
      DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
  proxy:
    image: nginx:stable-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEVELOPER_API_BASE_URL: ${DEVELOPER_API_BASE_URL:?required}
      NGINX_ENVSUBST_FILTER: ^DEVELOPER_API_BASE_URL$$
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - 127.0.0.1:8080:80
    restart: unless-stopped
